<%
local dispatcher = require "luci.dispatcher"
local token = (dispatcher.context and dispatcher.context.token) or ""
%>

<%+tasks/embed%>

<style type="text/css">
.agentflow-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.agentflow-agent-modal { position:fixed; inset:0; z-index:10000; display:none; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; background:rgba(15,23,42,.45); }
.agentflow-agent-modal.open { display:flex; }
.agentflow-agent-dialog { width:min(520px, 100%); padding:20px; box-sizing:border-box; border:1px solid #d0d7de; border-radius:12px; background:#fff; box-shadow:0 18px 48px rgba(15,23,42,.24); }
.agentflow-agent-dialog h3 { margin:0 0 8px; }
.agentflow-agent-dialog > p { margin:0 0 16px; color:#666; }
.agentflow-agent-options { display:grid; gap:10px; }
.agentflow-agent-option { display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid #d0d7de; border-radius:8px; cursor:pointer; }
.agentflow-agent-option:hover { border-color:#7c8ca5; background:#f7f9fc; }
.agentflow-agent-option input { margin-top:3px; }
.agentflow-agent-option strong, .agentflow-agent-option span { display:block; }
.agentflow-agent-option span { margin-top:3px; color:#666; font-size:12px; }
.agentflow-agent-dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
@media (prefers-color-scheme: dark) {
	.agentflow-agent-dialog { border-color:#465166; background:#1f2937; color:#e5e7eb; }
	.agentflow-agent-dialog > p, .agentflow-agent-option span { color:#aeb8c7; }
	.agentflow-agent-option { border-color:#465166; }
	.agentflow-agent-option:hover { border-color:#8492a6; background:#273449; }
}
</style>

<script type="text/javascript">//<![CDATA[
var agentflowOpenUrl = '<%=url("admin/services/agentflow/open")%>';
var agentflowAgentInstallUrl = '<%=url("admin/services/agentflow/agent_install")%>';
var agentflowCsrfToken = '<%=token%>';

function agentflowAgentDialog(open) {
	var modal = document.getElementById('agentflow-agent-modal');
	if (!modal) return;
	if (open) modal.classList.add('open');
	else modal.classList.remove('open');
}

function agentflowInstallAgent() {
	var selected = document.querySelector('input[name="agentflow-agent"]:checked');
	var button = document.getElementById('agentflow-agent-install-now');
	if (!selected || !button) return;
	if (!window.taskd || !window.taskd.show_log) {
		alert('<%:Task log window is not available.%>');
		return;
	}

	button.disabled = true;
	(new XHR()).post(agentflowAgentInstallUrl, {
		agent: selected.value,
		token: agentflowCsrfToken
	}, function(x, data) {
		button.disabled = false;
		if (!data) {
			try { data = JSON.parse(x.responseText || '{}'); }
			catch (e) { data = {}; }
		}
		if (!data.ok) {
			alert(data.error || '<%:Failed to start agent installation.%>');
			return;
		}
		agentflowAgentDialog(false);
		window.taskd.show_log(data.task_id || 'agentflow-agent-install');
	});
}

XHR.poll(5, '<%=url("admin/services/agentflow_status")%>', null, function(x, st) {
	var el = document.getElementById('agentflow_status');
	if (st && el) {
		if (!st.running) {
			el.innerHTML = '<br/><em style="color:red"><%:The AgentFlow service is not running.%></em>';
		} else {
			var accessMode = '';
			if (st.proxy_prefix_enabled && st.linkeasefull_running) {
				accessMode = '<br/><em><%:Access mode: LinkEase Desktop /apps proxy.%></em>';
			} else {
				accessMode = '<br/><em><%:Access mode: external port.%></em>';
			}
			el.innerHTML = '<br/><em style="color:green"><%:The AgentFlow service is running.%></em>'
				+ accessMode
				+ "<br/><br/><input class=\"btn cbi-button cbi-button-apply\" type=\"button\" value=\" <%:Click to open AgentFlow%> \" onclick=\"window.open('" + agentflowOpenUrl + "')\"/>";
		}
	}
});

document.addEventListener('keydown', function(ev) {
	if (ev.key === 'Escape') agentflowAgentDialog(false);
});
//]]></script>

<fieldset class="cbi-section">
	<legend><%:Status%></legend>
	<p id="agentflow_status">
		<em><%:Collecting data...%></em>
	</p>
	<div class="agentflow-actions">
		<input class="btn cbi-button cbi-button-action" type="button" value="<%:Install agent%>" onclick="agentflowAgentDialog(true)">
	</div>
</fieldset>

<div id="agentflow-agent-modal" class="agentflow-agent-modal" role="dialog" aria-modal="true" aria-labelledby="agentflow-agent-title" onclick="if (event.target === this) agentflowAgentDialog(false)">
	<div class="agentflow-agent-dialog">
		<h3 id="agentflow-agent-title"><%:Install agent%></h3>
		<p><%:Select a coding agent to install into the shared AgentFlow runtime.%></p>
		<div class="agentflow-agent-options">
			<label class="agentflow-agent-option">
				<input type="radio" name="agentflow-agent" value="codex" checked>
				<span><strong>Codex</strong><span><%:OpenAI coding agent CLI%></span></span>
			</label>
			<label class="agentflow-agent-option">
				<input type="radio" name="agentflow-agent" value="claude-code">
				<span><strong>Claude Code</strong><span><%:Anthropic coding agent CLI%></span></span>
			</label>
		</div>
		<div class="agentflow-agent-dialog-actions">
			<input class="btn cbi-button" type="button" value="<%:Cancel%>" onclick="agentflowAgentDialog(false)">
			<input id="agentflow-agent-install-now" class="btn cbi-button cbi-button-apply" type="button" value="<%:Install now%>" onclick="agentflowInstallAgent()">
		</div>
	</div>
</div>
